# .github/workflows/build-docs.yml
# See https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: Build Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "src/**/*.py"
      - "noxfile.py"
      - "pyproject.toml"
      - ".github/workflows/build-docs.yml"
      - ".ruff.toml" # Affects docstrings via linting
      - "pyrightconfig.json" # Basedpyright config - affects type hints in docs

  push:
    branches:
      - main
      - master
    paths:
      - "docs/**"
      - "src/**/*.py"
      - "noxfile.py"
      - "pyproject.toml"
      - ".github/workflows/build-docs.yml"

  workflow_dispatch:

jobs:
  build-docs:
    name: Run Documentation Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ".github/workflows/.python-version"

      - name: Build documentation
        run: uvx nox -s build-docs

      - name: Upload documentation (HTML) Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: html-docs
          path: docs/_build/html/
