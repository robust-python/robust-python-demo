name: Finalize Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      commit:
        description: Exact commit to release; defaults to the selected ref
        required: false
        type: string

concurrency:
  group: finalize-release-${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    name: Resolve immutable release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve and validate inputs
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGED_REF: ${{ github.event.pull_request.head.ref }}
          MERGED_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          PUSHED_TAG: ${{ github.ref_name }}
          PUSHED_COMMIT: ${{ github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              version="${MERGED_REF#release/}"
              commit="$MERGED_COMMIT"
              ;;
            push)
              version="${PUSHED_TAG#v}"
              commit="$PUSHED_COMMIT"
              ;;
            workflow_dispatch)
              version="$INPUT_VERSION"
              commit="${INPUT_COMMIT:-$PUSHED_COMMIT}"
              ;;
          esac
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          if [[ ! "$commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The release commit must be a full Git object ID." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Revalidate the release commit
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Validate versions, locks, changelog, and tag state
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: uv run --locked nox -s validate-release

  build:
    name: Build immutable release artifacts
    needs: [resolve, validate]
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      artifact-prefix: release-final

  bundle:
    name: Assemble release bundle
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Download every native artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-final-*
          path: dist
          merge-multiple: true

      - name: Reject duplicate or invalid distributions
        run: uv run --locked twine check dist/*.whl dist/*.tar.gz

      - name: Create the immutable artifact manifest
        run: uv run --locked nox -s write-artifact-manifest -- dist release-artifacts.json

      - name: Upload the immutable release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle-${{ needs.resolve.outputs.tag }}
          path: |
            dist/
            release-artifacts.json
          if-no-files-found: error
          retention-days: 30

  testpypi:
    name: Publish and verify TestPyPI
    needs: [resolve, bundle]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Download the immutable release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle-${{ needs.resolve.outputs.tag }}

      - name: Publish to TestPyPI
        run: >-
          uv publish dist/* --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/

      - name: Verify TestPyPI filenames, metadata, and hashes
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: uv run --locked nox -s verify-release-index -- testpypi release-artifacts.json

  tag:
    name: Create the protected release tag
    needs: [resolve, testpypi]
    runs-on: ubuntu-latest
    environment: release-tag
    permissions:
      contents: write
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Create or verify the annotated tag
        run: uv run --locked nox -s finalize-release -- "${{ needs.resolve.outputs.version }}" "${{ needs.resolve.outputs.commit }}"

      - name: Push the release tag
        run: git push origin "refs/tags/${{ needs.resolve.outputs.tag }}"

  pypi:
    name: Publish the tested Python artifacts to PyPI
    needs:
      - resolve
      - tag

    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Download the tested release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle-${{ needs.resolve.outputs.tag }}

      - name: Check for conflicting PyPI files
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: uv run --locked nox -s verify-release-index -- pypi release-artifacts.json --allow-missing

      - name: Publish the tested files to PyPI
        run: uv publish dist/* --trusted-publishing always --check-url https://pypi.org/simple/

      - name: Verify the completed PyPI publication
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: uv run --locked nox -s verify-release-index -- pypi release-artifacts.json

  github-release:
    name: Create the GitHub release
    needs: [resolve, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Download the tested release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle-${{ needs.resolve.outputs.tag }}

      - name: Extract the committed changelog section
        run: uv run --locked nox -s extract-release-notes -- "${{ needs.resolve.outputs.version }}" release-notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ needs.resolve.outputs.tag }}" >/dev/null 2>&1; then
            gh release edit "${{ needs.resolve.outputs.tag }}" --notes-file release-notes.md --verify-tag
            gh release upload "${{ needs.resolve.outputs.tag }}" dist/* --clobber
          else
            gh release create "${{ needs.resolve.outputs.tag }}" dist/* --notes-file release-notes.md --title "${{ needs.resolve.outputs.tag }}" --verify-tag
          fi

  backmerge:
    name: Open the main-to-develop backmerge
    needs: [resolve, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out develop with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: develop
          fetch-depth: 0

      - name: Create the backmerge pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          branch="backmerge/$TAG"
          if gh pr list --state open --base develop --head "$branch" --json number --jq 'length > 0' | grep -q true; then
            echo "The backmerge pull request already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          git checkout -B "$branch" origin/develop
          if ! git merge --no-ff --no-edit origin/main; then
            git merge --abort
            echo "Backmerge conflict: merge main into develop locally, resolve the conflicts, and open the pull request manually." >&2
            exit 1
          fi
          git push --force-with-lease origin "$branch"
          gh pr create --base develop --head "$branch" --title "chore: backmerge $TAG into develop" --body "Backmerge the released main branch into develop after $TAG."
