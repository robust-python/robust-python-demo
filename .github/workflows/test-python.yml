# .github/workflows/test-python.yml
# See https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: Test Python Code

on:
  pull_request:
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "noxfile.py"
      - "pyproject.toml"
      - ".coveragerc"
      - ".github/workflows/test-python.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "noxfile.py"
      - "pyproject.toml"
      - ".coveragerc"
      - ".github/workflows/test-python.yml"

  workflow_dispatch:

jobs:
  test-python:
    name: Run Python Tests on ${{ matrix.os }}/${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { python: "3.10", os: "ubuntu-latest" }
          - { python: "3.11", os: "ubuntu-latest" }
          - { python: "3.12", os: "ubuntu-latest" }
          - { python: "3.13", os: "ubuntu-latest" }
          - { python: "3.14", os: "ubuntu-latest" }
          - { python: "3.14", os: "macos-latest" }
          - { python: "3.14", os: "windows-latest" }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run test suite
        run: uvx nox -s tests-python-${{ matrix.python }}

      - name: Upload test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: tests/results/*.xml
          retention-days: 5

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          retention-days: 5
